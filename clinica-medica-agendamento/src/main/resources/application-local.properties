# Define the port where the application will run
server.port=8081

# Database configurations
spring.datasource.url=jdbc:mysql://localhost:3340/clinica_medica?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# HikariCP configurations
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=HikariCP

# Hibernate configurations
# Disables automatic schema generation
spring.jpa.hibernate.ddl-auto=update
# Enables logging of SQL statements
spring.jpa.show-sql=true

# SQL initialization settings
# Ensures SQL scripts are always executed on startup
spring.sql.init.mode=always
# spring.sql.init.data-locations=classpath:data-local.sql
spring.sql.init.encoding=utf-8

#logging.level.root=DEBUG

# JWT Configuration
jwt.secret=mySecretKey123qwe123qwe123qwe123qwe123qweqweasd1qeqweasdasdqweqwdasdasqwe
jwt.expiration=86400
